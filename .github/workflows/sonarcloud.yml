name: SonarCloud Reusable

on:
  workflow_call:
    inputs:
      ref_name:
        required: true
        type: string
      event_type:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      GITHUB_TOKEN:
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean compile -B

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.ci.autoconfig.disabled=true
            -Dsonar.ci.skipAutomaticAnalysis=true
            -Dsonar.projectKey=satishkandekar_spring-boot-hello-world
            -Dsonar.organization=satishkandekar
            -Dsonar.java.binaries=target
            -Dsonar.branch.name=${{ inputs.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}