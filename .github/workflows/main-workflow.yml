name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened, closed, merged]
    branches:
      - master
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  codeql-analysis:
    uses: ./.github/workflows/codeql-analysis.yml
    with:
      branch_name: ${{ github.ref_name }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud:
    uses: ./.github/workflows/sonarcloud.yml
    with:
      branch_name: ${{ github.ref_name }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    needs: [codeql-analysis, sonarcloud]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
    uses: ./.github/workflows/docker-build.yml
    with:
      branch_name: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
