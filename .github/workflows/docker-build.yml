name: Docker Build Reusable

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Tag
        id: tag
        run: |
          if [[ "${{ inputs.ref }}" == "refs/heads/master" || "${{ inputs.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_ENV
          else
            SHORT_SHA=$(echo "${{ inputs.sha }}" | cut -c1-7)
            echo "tag=$(date +%Y%m%d%H%M%S)-${SHORT_SHA}" >> $GITHUB_ENV
          fi

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo:${{ env.tag }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-demo:${{ env.tag }}